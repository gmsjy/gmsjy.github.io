<ul class="post-list">
{%- for p in posts %}
  <li class="post-item">
    <a href="{{p.url}}">
      <div class="post-title">{{p.title}}</div>
      {%- if p.date %}<div class="post-date">{{p.date}}</div>{% endif -%}
      {%- if p.excerpt %}<p class="post-excerpt">{{p.excerpt}}</p>{% endif -%}
      {%- if p.tags %}
      <div class="post-tags">{% for t in p.tags | split(pat=", ") %}<span class="tag">{{t}}</span>{% endfor %}</div>
      {%- endif %}
    </a>
  </li>
{%- endfor %}
</ul>
