<!DOCTYPE html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{full_title}}</title>
<meta name="description" content="{{site_description}}">
<link rel="stylesheet" href="/assets/style.css">
{{seo_head}}
{{math_style}}
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="site-title" href="/">{{site_title}}</a>
    <nav class="site-nav">
      {{nav_extra}}
      <a href="/">首页</a>
      <a href="/search/">搜索</a>
    </nav>
  </div>
</header>
<main>
{{body}}
</main>

<!--
  评论系统接入示例（v0.3 B8）——基于 giscus（GitHub Discussions）。

  使用步骤：
    1. 访问 https://giscus.app/zh-CN 配置并启用 Discussions，得到 repo_id / category_id
    2. 在 typall.toml 启用本主题并填齐下列参数：
        [theme]
        name = "comments-demo"
        [theme.params]
        giscus_repo        = "owner/repo"          # GitHub 仓库
        giscus_repo_id     = "R_kgDOxxxxx"
        giscus_category    = "General"             # 默认
        giscus_category_id = "DIC_kwDOxxxxx"
        giscus_mapping     = "pathname"            # 默认
        giscus_lang        = "zh-CN"               # 默认 en
    3. typall build

  切换为 utterances（基于 GitHub Issues，配置更简单）——
  将下方 <script> 整段替换为：
      <script src="https://utteranc.es/client.js"
              repo="owner/repo"
              issue-term="pathname"
              label="comment"
              theme="github-light"
              crossorigin="anonymous" async></script>
-->
<section class="comments" aria-label="评论">
  <h2>评论</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{params.giscus_repo}}"
          data-repo-id="{{params.giscus_repo_id}}"
          data-category="{{params.giscus_category}}"
          data-category-id="{{params.giscus_category_id}}"
          data-mapping="{{params.giscus_mapping}}"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="{{params.giscus_lang}}"
          crossorigin="anonymous"
          async></script>
</section>

<footer class="site-footer">{{site_title}} · 评论由 giscus 提供</footer>
</body>
</html>
