[site]
title = "知止的物理世界"
description = "一个用 Typst 驱动的静态博客"
url = "https://gmsjy.github.io"
author = "gmsjy"
language = "zh-CN"

[build]
output_dir = "public"
strict = false
drafts = false

[build.math]
renderer = "svg"
number_equations = true
equation_prefix = "公式"

[theme]
name = "default"

[deploy]
strategy = "git"               # git | copy | netlify | vercel

[deploy.git]
repo = "https://github.com/gmsjy/gmsjy.github.io.git"
# 禁止指向 main：main 是源码分支，Pages 实际走 GitHub Actions 模式
# （.github/workflows/deploy.yml 构建部署）。曾把构建产物推上 main
# 清空过远端源码（deploy-20260918-011504），故产物只落独立分支。
branch = "built-site"
commit_message = "Update blog at {timestamp}"
auto_push = true
