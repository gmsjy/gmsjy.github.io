# 构建并部署静态站到 GitHub Pages（用户站点 gmsjy.github.io）。
# 内置每日定时构建：「定时发布」（未来日期文章到点自动上线）由此生效。
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 每天 UTC 21:00（北京时间次日 5:00）构建一次
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: typall

      - name: Build typall binary
        run: cargo build --release --manifest-path typall/Cargo.toml

      - name: Build site
        run: cd typall && ./target/release/typall build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: typall/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
