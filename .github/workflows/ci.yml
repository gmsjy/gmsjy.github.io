name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 缓存 target/ 与 ~/.cargo（typall crate 在子目录）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: typall

      - name: Test
        run: cargo test --manifest-path typall/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path typall/Cargo.toml --all-targets -- -D warnings
